<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 style="font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif; font-weight: 800;margin-top: 10px;">Image gallery</h1>
        <div class="container-images">
           
            <img class="image1" src="./images/Beautiful calm night in mountain forest with moon and stars.jpeg" alt="">
            <img class="image2" src="./images/images (9).jpeg" alt="">
            <img class="image3" src="./images/istockphoto-1403500817-612x612.jpg" alt="">
        </div>
    </div>

    <div class="overlay" style="display: none;">
        <div class="popup">
            <img class="img-1" src="./images/Beautiful calm night in mountain forest with moon and stars.jpeg" alt="" style="display: none;">
            <img class="img-2" src="./images/images (9).jpeg" alt="" style="display: none;">
            <img class="img-3" src="./images/istockphoto-1403500817-612x612.jpg" alt="" style="display: none;">
            <p class="btn">X</p> 
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
